name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing
        env:
          KEYSTORE_B64: ${{ secrets.FLIPLINK_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FLIPLINK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FLIPLINK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FLIPLINK_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > release.jks
            cat <<EOF > signing.properties
          storeFile=release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          else
            echo "Release signing secrets not configured; falling back to debug signing."
          fi

      - name: Resolve release metadata
        id: meta
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run unit tests and build release APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease -PversionName="${{ steps.meta.outputs.version }}"

      - name: Prepare release artifacts
        run: |
          mkdir -p dist
          APK_NAME="FlipLink-${{ steps.meta.outputs.tag }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/$APK_NAME"
          (cd dist && sha256sum "$APK_NAME" > "$APK_NAME.sha256")

      - name: Clean up temporary signing files
        if: always()
        run: rm -f release.jks signing.properties

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: FlipLink ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/*.sha256
